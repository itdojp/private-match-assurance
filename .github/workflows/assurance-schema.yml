name: Assurance Schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-dev.txt
      - name: Install integrity-locked build backend
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Install integrity-locked validation dependencies
        run: python -m pip install --require-hashes --no-build-isolation -r requirements-dev.txt
      - name: Run schema validator tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile and lint Python
        run: |
          python -m compileall -q scripts tests
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Export synthetic public Evidence fixture
        run: |
          python scripts/export_public_evidence.py \
            --mode test-fixture \
            --staging-root tests/fixtures/export/input \
            --input protocol-conformance.json \
            --output-dir .codex-local/tmp/export
          cmp \
            tests/fixtures/export/expected/protocol-conformance.json \
            .codex-local/tmp/export/public-evidence-export.v0.1.json
      - name: Validate assurance records
        run: >-
          python scripts/validate_assurance.py
          --root .
          --report-dir artifacts
          --export-profile profiles/public-evidence-export.v0.1.json
          --export-mode test-fixture
          --export-bundle .codex-local/tmp/export/public-evidence-export.v0.1.json
      - name: Validate REUSE licensing metadata
        run: reuse lint
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-schema-report
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
