name: Assurance Schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - name: Install exact Node dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
      - name: Install integrity-locked build backend
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Install integrity-locked validation dependencies
        run: python -m pip install --require-hashes --no-build-isolation -r requirements-dev.txt
      - name: Run schema validator tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate exact ae-framework integration
        run: |
          python scripts/ae_framework_manifest.py --check
          python scripts/ae_assurance_implementation.py --check
          python scripts/validate_ae_assurance.py
          python scripts/generate_ae_assurance_fixtures.py --check
      - name: Compile and lint Python
        run: |
          python -m compileall -q scripts tests
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Validate assurance records without public export
        run: >-
          python scripts/validate_assurance.py
          --root .
          --report-dir .codex-local/tmp/validation
      - name: Validate REUSE licensing metadata
        run: reuse lint
