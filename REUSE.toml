version = 1
SPDX-PackageName = "private-match-assurance"
SPDX-PackageSupplier = "ITDO Inc. / 株式会社アイティードゥ"

[[annotations]]
path = [
  ".github/workflows/assurance-schema.yml",
  ".gitignore",
  "REUSE.toml",
  "requirements-build.in",
  "requirements-build.txt",
  "requirements-dev.in",
  "requirements-dev.txt",
  "manifests/*.json",
  "profiles/*.json",
  "schema/*.json",
  "scripts/*.py",
  "tests/*.py",
  "tests/fixtures/export/**/*.json",
  "tests/fixtures/invalid/*.json",
  "tests/fixtures/valid/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ITDO Inc. / 株式会社アイティードゥ"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "AGENTS.md",
  "GOVERNANCE.md",
  "README.md",
  "ROADMAP.md",
  "SECURITY.md",
  "docs/*.md",
  "docs/decisions/*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ITDO Inc. / 株式会社アイティードゥ"
SPDX-License-Identifier = "CC-BY-4.0"
